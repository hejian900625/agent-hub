<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Hub · 多智能体指挥台</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#161d2b; --line:#1f2937;
    --txt:#e6edf7; --dim:#7d8da6; --acc:#38bdf8;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--txt);
       font:13px/1.55 ui-monospace,"Cascadia Code",Consolas,"Microsoft YaHei",monospace}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0;letter-spacing:.5px}
  .dot{width:7px;height:7px;border-radius:50%;background:#ef4444;display:inline-block;margin-right:6px}
  .dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
  .spacer{flex:1}
  .tabs{display:flex;gap:2px}
  .tab{padding:4px 12px;border-radius:6px;cursor:pointer;color:var(--dim);border:1px solid transparent}
  .tab.active{background:var(--panel2);color:var(--txt);border-color:var(--line)}
  main{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0}
  aside{border-right:1px solid var(--line);overflow:auto;padding:12px;background:var(--panel)}
  .agent{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--panel2);
         cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .agent:hover{border-color:#334155;transform:translateY(-1px)}
  .agent.sel{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
  .agent .nm{display:flex;align-items:center;gap:8px;font-weight:600}
  .agent .vd{color:var(--dim);font-size:11px;margin-top:2px;line-height:1.7}
  .agent .cols{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
  .agent .cols .sep{color:#334155}
  .agent .qp{color:#38bdf8;font-size:10px;cursor:pointer;text-decoration:underline;margin-left:2px}
  .agent .qp:hover{color:#7dd3fc}
  .agent .age{margin-left:auto;font-size:10px;white-space:nowrap;color:#7d8da6}
  .agent .main{margin-left:7px;font-size:10px;font-weight:600}
  .agent .caps{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .agent .cap{font-size:9.5px;line-height:1.5;padding:0 5px;border-radius:999px;border:1px solid #334155;color:#94a3b8}
  #reauth.busy{cursor:progress;opacity:.85}
  .spin{display:inline-block;width:9px;height:9px;border:2px solid #475569;border-top-color:#e2e8f0;
        border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #billpanel{position:fixed;top:0;right:0;bottom:0;width:min(580px,94vw);background:var(--panel);
             border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;
             box-shadow:-24px 0 48px #0009}
  #billpanel.hidden{display:none}
  .bhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
  #billbody{flex:1;overflow:auto;padding:12px 14px}
  .bcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
  .bcard{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .bcard b{font-size:15px;font-weight:600}
  .bcard .k{color:var(--dim);font-size:10px;display:block;margin-bottom:1px}
  table.bt{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
  table.bt th{color:var(--dim);font-weight:500;text-align:left;padding:4px 5px;border-bottom:1px solid var(--line)}
  table.bt td{padding:4px 5px;border-bottom:1px solid #1a2434;white-space:nowrap}
  table.bt td.pr{max-width:190px;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
  .bsec{color:var(--dim);font-size:10px;letter-spacing:.5px;margin:10px 0 4px}
  .agent .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .tag{font-size:10px;padding:1px 6px;border-radius:999px;background:#0f172a;color:var(--dim);border:1px solid var(--line)}
  .tag.hot{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
  .sw{width:9px;height:9px;border-radius:3px;background:var(--c)}
  section{display:flex;flex-direction:column;min-height:0}
  #log{flex:1;overflow:auto;padding:14px 18px;scroll-behavior:smooth}
  .row{margin-bottom:3px;white-space:pre-wrap;word-break:break-word}
  .row .who{font-weight:600;margin-right:8px}
  .row.text{color:var(--txt)}
  .row.thinking{color:#64748b;font-style:italic}
  .row.log{color:#64748b;font-size:11.5px}
  .row.err{color:#f87171}
  .row.tool{color:#fbbf24}
  .row.res{color:#34d399;font-size:12px}
  .row.sys{color:var(--acc);font-size:11.5px}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #models{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .mrow{display:flex;gap:6px;align-items:center;font-size:12px}
  input[type=text],textarea,select{background:#0a0f18;border:1px solid var(--line);color:var(--txt);
        border-radius:8px;padding:8px 10px;font:inherit;outline:none}
  input:focus,textarea:focus{border-color:var(--acc)}
  textarea{flex:1;resize:none;height:52px}
  button{background:#1d4ed8;border:0;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font:inherit}
  button:hover{background:#2563eb}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  .chk{display:flex;align-items:center;gap:5px;color:var(--dim);cursor:pointer;font-size:12px}
  .chk input{accent-color:var(--acc)}
  .hint{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>AGENT HUB</h1>
  <span class="hint" id="conn">连接中…</span>
  <button class="ghost" id="reauth" title="重新探测各家登录状态（trae 会解密 storage.json 查积分）">刷新登录状态</button>
  <span class="hint" id="lastprobe" title="最近一次真实握手探测完成的时间">未探测</span>
  <button class="ghost" id="bills" title="查看任务级账单（本地 JSONL，记录 token / 费用 / 积分）">账单</button>
  <div class="spacer"></div>
  <div class="tabs">
    <div class="tab active" data-mode="single">单发</div>
    <div class="tab" data-mode="fanout">并行分发</div>
    <div class="tab" data-mode="chain">链式流水</div>
  </div>
</header>

<main>
  <aside id="agents"></aside>
  <section>
    <div id="log"></div>
    <footer>
      <div class="bar">
        <span class="hint">工作目录</span>
        <input type="text" id="cwd" style="flex:1;max-width:520px" placeholder="C:\\path\\to\\project">
        <span class="hint" id="contractlab" style="display:none;margin-left:12px">输出契约</span>
        <select id="contract" style="display:none;min-width:170px" title="每一步必须输出的格式；校验失败会带错误重试该步">
          <option value="text">文本（非空）</option>
          <option value="json">JSON</option>
          <option value="code">代码（围栏内）</option>
          <option value="files">产出文件</option>
        </select>
      </div>
      <div class="bar" id="modelbar" style="display:none">
        <!-- 每个选中的 agent 一行模型下拉：并行/链式时各自选各自的，不再只认第一个 -->
        <div id="models"></div>
        <span class="hint" id="modelhint"></span>
      </div>
      <div class="bar">
        <textarea id="prompt" placeholder="输入指令…（Ctrl+Enter 发送）"></textarea>
        <button id="send">派发</button>
        <button class="ghost" id="cancel" title="取消当前链/批次/全部在途任务">取消</button>
        <button class="ghost" id="clear">清屏</button>
      </div>
      <div class="bar" id="targets"></div>
    </footer>
  </section>
</main>

<div id="billpanel" class="hidden">
  <div class="bhead">
    <b>任务账单</b>
    <span class="hint" id="billfile"></span>
    <span class="spacer"></span>
    <button class="ghost" id="billrefresh">刷新</button>
    <button class="ghost" id="billclose">关闭</button>
  </div>
  <div id="billbody"><span class="hint">加载中…</span></div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const logEl = $('#log')
let agents = []
let selected = new Set()
let mode = 'single'
let activeTarget = null // 最近一次派发的取消句柄：{runId} | {batchId} | {groupId}

/* ---------- 拉取 agent 列表 ---------- */
async function loadAgents(fresh, { awaitVerify = false } = {}) {
  const r = await fetch('/api/agents' + (fresh ? '?fresh=1' : '')).then((x) => x.json())
  agents = r.agents
  renderAgents()
  renderTargets()
  // 首屏只给本地层（快），真实握手在后台逐个补 —— 每张卡自己变绿
  const p = verifyAgents(agents.map((a) => a.id), { fresh: !!fresh })
  if (awaitVerify) await p
}

/* ---------- 真实握手验证（三级状态的后两档） ---------- */
const verifying = new Set()
const queued = new Set()
const probeAt = new Map() // agentId -> 最近一次探测完成时间
const probeFail = new Map() // agentId -> { at, reason }
const escAttr = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

/** 秒级相对时间：12 秒前 / 3 分钟前 / 2 小时前 */
function probeAge(ts) {
  const s = Math.max(0, Math.round((Date.now() - Number(ts)) / 1000))
  if (s < 60) return `${s} 秒前`
  const m = Math.round(s / 60)
  if (m < 60) return `${m} 分钟前`
  const h = Math.round(m / 60)
  return h < 48 ? `${h} 小时前` : `${Math.round(h / 24)} 天前`
}

/** 陈旧度颜色：1 分钟内正常，5 分钟内变灰，超过 5 分钟明显变暗 */
function ageColor(ts) {
  const s = (Date.now() - Number(ts)) / 1000
  if (s < 60) return '#94a3b8'
  if (s < 300) return '#64748b'
  return '#3f4a5c'
}

function latestProbeAt() {
  let ts = 0
  for (const v of probeAt.values()) ts = Math.max(ts, v)
  for (const a of agents) ts = Math.max(ts, Number(a.auth?.verifiedAt) || 0)
  return ts
}

/** 按钮转圈 + 剩余数量；同时在顶栏显示最近一次探测时间 */
function renderProbeButton() {
  const btn = $('#reauth')
  if (!btn) return
  const n = verifying.size + queued.size
  btn.disabled = n > 0
  btn.classList.toggle('busy', n > 0)
  btn.innerHTML = n > 0 ? `<span class="spin"></span>探测中 · 剩 ${n}` : '刷新登录状态'
  const g = $('#lastprobe')
  if (g) {
    const ts = latestProbeAt()
    g.textContent = ts ? `上次探测 ${probeAge(ts)}` : '未探测'
    g.style.color = ts ? ageColor(ts) : '#7d8da6'
    g.title = ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '还没有完成过真实握手探测'
  }
}

async function verifyAgents(ids, { fresh = false, quota = false } = {}) {
  // 同一个 agent 不重复入队：连点刷新只会补跑还没探测的，不会叠加请求
  const queue = ids.filter((id) => !verifying.has(id) && !queued.has(id))
  if (!queue.length) return
  for (const id of queue) queued.add(id)
  renderAgents()
  renderProbeButton()

  const worker = async () => {
    while (queue.length) {
      const id = queue.shift()
      queued.delete(id)
      verifying.add(id)
      renderAgents()
      renderProbeButton()
      const ac = new AbortController()
      const timer = setTimeout(() => ac.abort(), 135_000)
      try {
        const q = `/api/verify?agent=${encodeURIComponent(id)}${fresh ? '&fresh=1' : ''}${quota ? '&quota=1' : ''}`
        const res = await fetch(q, { signal: ac.signal })
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        const r = await res.json()
        const next = r.agents?.[0]
        if (!next) throw new Error(r.error || '空响应')
        const i = agents.findIndex((x) => x.id === id)
        if (i >= 0) agents[i] = next
        // 命中 5 分钟缓存时 verifiedAt 是旧时间 —— 必须如实显示年龄，
        // 不能把「刚发了一次请求」当成「刚探测过」。
        probeAt.set(id, Number(next.auth?.verifiedAt) || Date.now())
        probeFail.delete(id)
      } catch (e) {
        const reason = e.name === 'AbortError' ? '超时' : '失败'
        probeAt.set(id, Date.now())
        probeFail.set(id, { at: Date.now(), reason })
        log(`验证 ${id} ${reason}：${e.message}`, 'err')
      } finally {
        clearTimeout(timer)
        verifying.delete(id)
        renderAgents()
        renderTargets()
        renderProbeButton()
      }
    }
  }
  // 并发 2：minimax/qoder 的探测各要 8~11s，起太多会把机器拖慢
  await Promise.all([worker(), worker()])
}

/**
 * 状态色只有一个来源：行首方块和行内文字都取这里，避免同一行两种符号互相打架。
 * 圆点/圆圈不再复用 —— 端口、服务、登录态一律用文字前缀表达。
 */
const LV_STYLE = {
  quota: { color: '#22c55e', name: '可用' },
  handshake: { color: '#f59e0b', name: '握手通过' },
  config: { color: '#7d8da6', name: '配置就绪' },
  none: { color: '#ef4444', name: '不可用' },
}

/**
 * 一个 Agent 有多条链路，不能用一句话概括整行：
 *   主状态 —— 只看「能不能建会话」：可派发 / 部分可用 / 未启动 / 仅配置 / 不可用
 *   能力   —— 额度 / 会话 / 模型 三个独立徽标，绿可用、红不可用、灰未验证
 *   通道   —— 实际派发通道（CDP 9336、CLI stream-json、ACP…），断了写「未监听」
 */
const REACH_STYLE = {
  ready: { color: '#22c55e', text: '可派发' },
  up: { color: '#22c55e', text: '可达' },
  partial: { color: '#f59e0b', text: '部分可用' },
  idle: { color: '#f59e0b', text: '未启动' },
  blocked: { color: '#f59e0b', text: '未启动' },
  config: { color: '#7d8da6', text: '仅配置' },
  down: { color: '#ef4444', text: '不可用' },
  'n/a': { color: '#7d8da6', text: '无需登录' },
}

/** 能力小标记的配色：绿=可用，红=不可用，灰=未验证 */
const capStyle = (ok) =>
  ok === true
    ? 'color:#22c55e;border-color:#22c55e55;background:#22c55e12'
    : ok === false
      ? 'color:#ef4444;border-color:#ef444455;background:#ef444412'
      : 'color:#94a3b8'

function viaOf(a) {
  if (a.dispatch?.via) return a.dispatch.via
  if (a.auth?.via) return a.auth.via
  const live = a.live || {}
  const guiPort = { doubao: 9335, alice: 9333, scnet: 9336 }[a.id]
  if (guiPort) return `CDP ${live.port || guiPort}`
  if (a.id === 'trae') return `CDP ${live.cdp?.port || 9334}`
  if (a.id === 'loomy') return live.up ? `HTTP ${live.port}` : 'ACP initialize'
  if (a.id === 'minimax') return 'CLI / ACP'
  return 'CLI'
}

function quotaOf(a) {
  const q = a.auth?.quota
  const when = q?.checkedAt ? `（${agoText(q.checkedAt)}）` : ''
  if (q?.ok === true && q.kind === 'credits') return `额度可用 · ${String(q.detail || '额度正常').split('，')[0]}${when}`
  if (q?.ok === true) return `请求 200 · 余额未暴露${when}`
  if (q?.ok === false) return `额度异常 · ${q.detail || '未知原因'}`
  const age = a.auth?.lastOkAt ? agoText(a.auth.lastOkAt) : ''
  return age ? `额度未知 · 上次成功 ${age}` : '额度未知'
}

/** 把时间戳说成人话；页面常驻时也能跟着当前时间走，不用等后端重算 */
function agoText(ts) {
  const n = Number(ts)
  if (!Number.isFinite(n) || n <= 0) return ''
  const m = Math.max(0, Math.round((Date.now() - n) / 60000))
  if (m < 1) return '刚刚'
  if (m < 60) return `${m} 分钟前`
  const h = Math.round(m / 60)
  return h < 48 ? `${h} 小时前` : `${Math.round(h / 24)} 天前`
}

/** 只有这三家的「探测额度」会真的多打一次请求；其余没有额度接口 */
const QUOTA_PROBES = new Set(['qoder', 'workbuddy', 'minimax'])

function renderAgents() {
  $('#agents').innerHTML = agents.map((a) => {
    const live = a.live
    const lv = a.auth?.level || 'none'
    const caps = a.capabilities || null
    const dispatch = a.dispatch || { ok: true, via: '', detail: '' }
    // 主状态只看「能不能建会话」；额度/模型只是附加能力，不能代表整行可用
    const primary =
      caps?.primary ||
      (a.auth?.status === 'n/a' ? 'n/a' : !dispatch.ok ? 'blocked' : lv === 'none' ? 'down' : lv === 'config' ? 'config' : 'up')
    const rs = REACH_STYLE[primary] || REACH_STYLE.config
    const dot = rs.color
    const via = caps?.channel || viaOf(a)
    // 没有精确余额的（7/8 家）给一个按需探针：发一条最小请求看返回码
    const probe = !verifying.has(a.id) && QUOTA_PROBES.has(a.id) && a.auth?.quota?.kind !== 'credits'
      ? `<span class="qp" data-id="${a.id}" title="发一条最小请求，区分 200 / 401 / 429 / 额度耗尽">探测额度</span>`
      : ''
    const stateTip = escAttr(
      `${a.label}：${rs.text}${caps?.session?.why ? ` · ${caps.session.why}` : ''}${dispatch.detail ? ` · ${dispatch.detail}` : ''} · 登录态${(LV_STYLE[lv] || LV_STYLE.none).name}${a.auth?.detail ? `（${a.auth.detail}）` : ''}${a.auth?.lastOkAt ? ` · 上次成功 ${agoText(a.auth.lastOkAt)}` : ''}`
    )

    // 每行自己说清楚：正在探测 / 排队 / 超时 / 上次探测多久前
    const ts = probeAt.get(a.id) || Number(a.auth?.verifiedAt) || 0
    const fail = probeFail.get(a.id)
    let ageText = '未探测'
    let ageCol = '#7d8da6'
    let ageState = 'age'
    let ageTip = '还没有这次会话内的探测记录'
    if (verifying.has(a.id)) {
      ageText = '探测中…'
      ageCol = '#38bdf8'
      ageState = 'live'
      ageTip = '正在发真实请求'
    } else if (queued.has(a.id)) {
      ageText = '排队中'
      ageCol = '#7d8da6'
      ageState = 'live'
      ageTip = '等待前面的探测完成（并发 2）'
    } else if (fail) {
      ageText = `${fail.reason} · ${probeAge(fail.at)}`
      ageCol = '#ef4444'
      ageState = 'live'
      ageTip = `最近一次探测${fail.reason}，时间 ${new Date(fail.at).toLocaleTimeString('zh-CN', { hour12: false })}`
    } else if (ts) {
      ageText = probeAge(ts)
      ageCol = ageColor(ts)
      ageTip = `上次探测 ${new Date(ts).toLocaleString('zh-CN', { hour12: false })}`
    }
    return `
    <div class="agent ${selected.has(a.id) ? 'sel' : ''}" data-id="${a.id}" style="--c:${a.accent}">
      <div class="nm"><span class="sw" style="background:${dot};box-shadow:0 0 0 3px ${dot}22" title="${stateTip}"></span>${a.label}<span class="main${primary === 'down' ? ' login' : ''}"${primary === 'down' ? ` data-id="${a.id}"` : ''} title="${stateTip}" style="color:${rs.color};${primary === 'down' ? 'cursor:pointer;text-decoration:underline' : ''}">${rs.text}${primary === 'down' ? '（点击登录）' : ''}</span>${
        a.installed ? '' : '<span style="margin-left:auto;color:#ef4444;font-size:10px">未安装</span>'
      }<span class="age" data-ts="${ts || ''}" data-state="${ageState}" title="${escAttr(ageTip)}" style="color:${ageCol}">${esc(ageText)}</span></div>
      ${
        caps
          ? `<div class="caps">
        <span class="cap" style="${capStyle(caps.quota.ok)}" title="额度：${escAttr(quotaOf(a))}">额度 ${esc(caps.quota.text)}</span>
        <span class="cap" style="${capStyle(caps.session.ok)}" title="会话：${escAttr(caps.session.why || '可建')}">会话 ${esc(caps.session.text)}</span>
        <span class="cap" style="${capStyle(caps.models.ok)}" title="模型：${escAttr(caps.models.text)}">模型 ${esc(caps.models.text)}</span>
      </div>`
          : ''
      }
      <div class="vd cols">
        <span>通道 ${esc(via)}</span>${probe}
      </div>
      <div class="tags">
        ${a.transports.map((t) => `<span class="tag ${['acp','http','cdp','client'].includes(t.kind) ? 'hot' : ''}">${t.name}</span>`).join('')}
      </div>
    </div>`
  }).join('')

  document.querySelectorAll('.agent').forEach((el) => {
    el.onclick = () => {
      const id = el.dataset.id
      if (mode === 'single') { selected.clear(); selected.add(id) }
      else selected.has(id) ? selected.delete(id) : selected.add(id)
      renderAgents(); renderTargets()
    }
  })
  document.querySelectorAll('.login').forEach((el) => {
    el.onclick = async (ev) => {
      ev.stopPropagation()
      const r = await post('/api/login', { agent: el.dataset.id })
      const extra = r.url ? `  \n登录地址：${r.url}` : ''
      log(r.ok ? `已启动登录流程 (pid ${r.pid})：${r.cmd}${extra}` : `登录失败：${r.error}`, r.ok ? 'sys' : 'err')
      if (r.ok) {
        // 登录态是异步落盘的：先快刷两次（6s / 15s），再慢刷几次兜住扫码慢的情况
        ;[6000, 15000, 40000, 90000].forEach((ms) =>
          setTimeout(async () => {
            await loadAgents(true)
          }, ms)
        )
      }
    }
  })
  document.querySelectorAll('.qp').forEach((el) => {
    el.onclick = (ev) => {
      ev.stopPropagation()
      verifyAgents([el.dataset.id], { fresh: true, quota: true })
    }
  })
}
function renderTargets() {
  const pick = [...selected].map((id) => agents.find((a) => a.id === id)?.label).join(' + ') || '未选择'
  $('#targets').innerHTML = `<span class="hint">目标：</span><b style="color:#38bdf8">${pick}</b>
    <span class="hint" style="margin-left:12px">${mode === 'chain' ? '按选择顺序串行，前一个输出注入后一个' : mode === 'single' ? '单击切换目标' : '可多选并行'}</span>`
  renderModel()
}

/* ---------- 模型选择（逐 agent 各自一份） ---------- */
const modelOf = new Map() // agentId -> 该 agent 选中的模型

function currentAgent() { const ids = [...selected]; return ids.length === 1 ? ids[0] : null }

/** 某 agent 该用的模型：用户选过且仍有效 → 用它；否则 defaultModel → 列表首项。 */
function modelSupported(agentId, m) {
  const a = agents.find((x) => x.id === agentId)
  // Loomy 不开客户端时只有 ACP 轨，imodel/* 是外壳注入的 provider，ACP 根本认不到
  if (agentId === 'loomy' && a && !a.live?.up) return !String(m).startsWith('imodel/')
  return true
}

function modelFor(agentId) {
  const a = agents.find((x) => x.id === agentId)
  const list = (a && a.models) || []
  if (!list.length) return undefined
  const usable = list.filter((m) => modelSupported(agentId, m))
  const pool = usable.length ? usable : list
  const want = modelOf.get(agentId)
  return pool.includes(want) ? want : (a.defaultModel && pool.includes(a.defaultModel) ? a.defaultModel : pool[0])
}

/** 为每个选中的 agent 各渲染一个下拉。没有模型的 agent（纯 GUI）显示不可选提示。 */
function renderModel() {
  const bar = $('#modelbar')
  const box = $('#models')
  const hint = $('#modelhint')
  const ids = [...selected]
  if (!ids.length) {
    bar.style.display = 'none'
    return
  }
  bar.style.display = 'flex'
  box.innerHTML = ids.map((id) => {
    const a = agents.find((x) => x.id === id) || { label: id }
    const list = a.models || []
    const accent = a.accent || '#38bdf8'
    if (!list.length) {
      return `<div class="mrow"><b style="color:${accent}">${a.label}</b>`
        + `<span class="hint">无模型可选（客户端自管）</span></div>`
    }
    return `<div class="mrow"><b style="color:${accent}">${a.label}</b>`
      + `<select data-model-for="${id}" style="min-width:210px">`
      + list.map((m) => {
        const ok = modelSupported(id, m)
        return `<option value="${esc(m)}"${m === modelFor(id) ? ' selected' : ''}${ok ? '' : ' disabled'}>${esc(m)}${ok ? '' : '（需开客户端）'}</option>`
      }).join('')
      + `</select></div>`
  }).join('')

  // 逐个绑定：改哪个就记到哪个 agent 头上，互不影响
  box.querySelectorAll('select[data-model-for]').forEach((sel) => {
    const id = sel.dataset.modelFor
    sel.onchange = () => {
      modelOf.set(id, sel.value)
      hint.textContent = `已为 ${label(id)} 选定 ${sel.value}`
    }
  })

  hint.textContent = ids.length > 1
    ? `${ids.length} 个 agent 各自用自己这一行的模型（未改动的用各自默认值）`
    : ''
}


// 单发用当前下拉值；批量时逐 agent 各自取值
const curModel = () => { const id = currentAgent(); return id ? modelFor(id) : undefined }

/* ---------- 按 mode 派发 ---------- */
async function dispatch() {
  const prompt = $('#prompt').value.trim()
  const cwd = $('#cwd').value.trim() || undefined
  const ids = [...selected]
  if (!prompt) return log('请先输入指令', 'sys')
  if (!ids.length) return log('请先在左侧选择 agent', 'sys')
  const bad = ids
    .map((id) => ({ id, model: modelFor(id) }))
    .filter((x) => x.model && !modelSupported(x.id, x.model))
  if (bad.length) {
    return log(
      `模型与当前通道不匹配：${bad.map((x) => `${label(x.id)} ${x.model}`).join('、')}。Loomy 客户端未开时只能选 opencode/*。`,
      'err'
    )
  }

  if (mode === 'single') {
    const { runId } = await post('/api/run', { agent: ids[0], prompt, cwd, model: modelFor(ids[0]) })
    activeTarget = runId ? { runId } : null
    log(`→ ${label(ids[0])} 已派发 (${runId})`, 'sys')
  } else if (mode === 'fanout') {
    // 先把每个 agent 的模型定下来（含默认值），再派发 —— 日志和请求体用同一份，不会对不上
    const plan = ids.map((agent) => ({ agent, model: modelFor(agent) }))
    log(`→ 并行分发至 ${plan.map((p) => `${label(p.agent)}(${p.model || '默认'})`).join(' / ')}（每家独立沙箱）`, 'sys')
    const out = await post('/api/fanout', { agents: plan, prompt, cwd })
    if (out.error) return log(`派发失败：${out.error}`, 'err')
    activeTarget = out.batchId ? { batchId: out.batchId } : null
    for (const s of out.sandboxes || []) {
      const what = s.note || `复制 ${s.copied} 个文件`
      log(`沙箱 ${label(s.agent)} → ${s.dir}（${what}）`, 'sys', s.agent)
    }
    if (out.isolated) watchFanout(out.batchId)
    else log('只有 1 个目标，未启用沙箱隔离', 'sys')
  } else {
    // after 用「id 下标」；plan 数组里多带一个 model 字段给日志用，发出去前再剥掉
    const ctype = $('#contract').value
    const expect =
      ctype === 'text' ? { type: 'text', minLength: 1, retry: 1 }
      : ctype === 'code' ? { type: 'code', requireFence: true, retry: 1 }
      : { type: ctype, retry: 1 }
    const plan = ids.map((agent, i) => ({
      agent,
      prompt,
      cwd,
      model: modelFor(agent),
      expect,
      after: i ? [i - 1] : [],
    }))
    const cname = $('#contract').selectedOptions[0]?.textContent || ctype
    log(`→ 链式流水：${plan.map((p) => `${label(p.agent)}(${p.model || '默认'})`).join(' → ')} · 每步输出契约：${cname}`, 'sys')
    const out = await post('/api/orchestrate', { plan, cwd })
    if (out.groupId) activeTarget = { groupId: out.groupId }
    if (out.skipped?.length) {
      for (const s of out.skipped) log(`跳过第 ${s.index + 1} 步 ${label(s.agent)}：${s.reason}`, 'err', s.agent)
    }
  }
}
const post = (u, b) => fetch(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }).then((r) => r.json())

/** 轮询并行批次的对比报告；全部跑完后把差异打进日志 */
async function watchFanout(batchId) {
  const t0 = Date.now()
  while (Date.now() - t0 < 20 * 60 * 1000) {
    await new Promise((r) => setTimeout(r, 2000))
    let r
    try {
      r = await fetch(`/api/fanout/${encodeURIComponent(batchId)}`).then((x) => x.json())
    } catch {
      continue
    }
    if (!r || r.error) return log(`对比失败：${r?.error || '未知错误'}`, 'err')
    if (!r.ready) continue
    const rep = r.report
    log(`—— 并行对比完成 · ${rep.summary} ——`, 'sys')
    for (const a of rep.agents) {
      log(`${label(a.agent)}：新增 ${a.added.length} / 修改 ${a.modified.length} / 删除 ${a.removed.length}，共 ${a.fileCount} 个文件`, 'sys', a.agent)
    }
    for (const c of rep.comparisons) {
      if (c.differingCount === 0) log(`${label(c.a)} vs ${label(c.b)}：完全一致`, 'sys')
      else {
        const head = c.differing.slice(0, 8).join(', ')
        log(`${label(c.a)} vs ${label(c.b)}：${c.differingCount} 个文件不同 → ${head}${c.differingCount > 8 ? ' …' : ''}`, 'sys')
      }
    }
    if (rep.baselineSkipped) log('源目录过大，未做 baseline 快照，只比较沙箱之间的差异', 'sys')
    if (r.reportFile) log(`完整报告：${r.reportFile}`, 'sys')
    return
  }
  log('并行对比等待超时（20 分钟），请稍后看 /api/fanout/' + batchId, 'err')
}

const label = (id) => agents.find((a) => a.id === id)?.label || id
const colorOf = (id) => agents.find((a) => a.id === id)?.accent || '#38bdf8'

/* ---------- 日志 ---------- */
function log(msg, cls = 'log', who) {
  const d = document.createElement('div')
  d.className = 'row ' + cls
  const nearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 80
  d.innerHTML = (who ? `<span class="who" style="color:${colorOf(who)}">[${label(who)}]</span>` : '') + esc(msg)
  logEl.appendChild(d)
  if (nearBottom) logEl.scrollTop = logEl.scrollHeight
  return d
}
function fmtToolInput(input) {
  if (input == null) return ''
  if (typeof input === 'string') return input.slice(0, 160)
  // 常见形状：{command} / {filePath} / {pattern,path} / {description}
  const pick = input.command || input.filePath || input.path || input.pattern || input.description
  if (pick) return String(pick).slice(0, 160)
  try {
    const j = JSON.stringify(input)
    return j === '{}' ? '' : j.slice(0, 160)
  } catch {
    return ''
  }
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))

/* ---------- SSE ---------- */
let cur = {}
function connect() {
  const es = new EventSource('/api/events')
  es.onopen = () => { $('#dot').classList.add('on'); $('#conn').textContent = '已连接' }
  es.onerror = () => { $('#dot').classList.remove('on'); $('#conn').textContent = '断开，重连中…' }
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data)
    handle(ev)
  }
}

const inflight = {}
function handle(ev) {
  const key = ev.runId
  switch (ev.type) {
    case 'run_start':
      inflight[key] = log(`启动 (${ev.transport}${ev.cwd ? ' · ' + ev.cwd : ''})`, 'sys', ev.agentId)
      break
    case 'session':
      log(`session ${ev.phase}: ${ev.sessionId}`, 'sys', ev.agentId)
      break
    case 'text': {
      const buf = inflight[key + ':t'] || (inflight[key + ':t'] = log('', 'text', ev.agentId))
      buf.textContent += ev.delta
      break
    }
    case 'thinking': {
      const buf = inflight[key + ':k'] || (inflight[key + ':k'] = log('', 'thinking', ev.agentId))
      buf.textContent += ev.delta
      break
    }
    case 'tool_call':
      log(`⚙ ${ev.name} ${fmtToolInput(ev.input)}`, 'tool', ev.agentId)
      break
    case 'tool_result': {
      // 工具结果是「成功/失败 + 输出」，不是错误；空输出也要有个明确说法，
      // 否则只显示一个 ✓ 看不出到底做了什么。
      const out = String(ev.output ?? '').trim()
      const head = out ? out.slice(0, 220) : '（无输出）'
      log(`✓ ${ev.name ? ev.name + ' ' : ''}${head}`, 'res', ev.agentId)
      break
    }
    case 'permission':
      log(`⚠ 需要授权: ${ev.id || ''}`, 'err', ev.agentId)
      break
    case 'log':
      if (ev.level !== 'debug') log(ev.message, 'log', ev.agentId)
      break
    case 'done':
      log(`完成 (${ev.stopReason || 'ok'})`, 'sys', ev.agentId)
      scheduleBills()
      break
    case 'cancelled':
      log(`已取消${ev.reason ? `：${ev.reason}` : ''}`, 'err', ev.agentId)
      scheduleBills()
      break
    case 'error':
      log(`错误: ${ev.message}`, 'err', ev.agentId)
      scheduleBills()
      break
  }
}

/* ---------- 交互 ---------- */
document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'))
    t.classList.add('active')
    mode = t.dataset.mode
    if (mode === 'single' && selected.size > 1) { const f = [...selected][0]; selected.clear(); selected.add(f) }
    const chainOnly = mode === 'chain' ? '' : 'none'
    $('#contract').style.display = chainOnly
    $('#contractlab').style.display = chainOnly
    renderAgents(); renderTargets()
  }
})
$('#send').onclick = dispatch
$('#prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); dispatch() }
})
$('#clear').onclick = () => { logEl.innerHTML = ''; for (const k in inflight) delete inflight[k] }

$('#cancel').onclick = async () => {
  const target = activeTarget || { all: true }
  const what = activeTarget
    ? Object.entries(activeTarget).map(([k, v]) => `${k}=${v}`).join(' ')
    : '全部在途任务'
  const r = await post('/api/cancel', target)
  if (r.ok) log(`已请求取消：${what}（在途步骤会收到 abort，未派发的直接跳过）`, 'sys')
  else log(`取消失败：${r.error || '未知错误'}`, 'err')
}

/* ---------- 任务账单（本地 JSONL 的可视化） ---------- */
const fmtNum = (v) => (v == null ? '—' : Number(v).toLocaleString('zh-CN'))
const fmtUsd = (v) => (v == null ? '—' : `$${Number(v).toFixed(4)}`)
const fmtCr = (v) => (v == null ? '—' : Number(v).toFixed(3))
const billWhen = (ts) => new Date(Number(ts) || Date.now()).toLocaleString('zh-CN', { hour12: false })

async function loadBills() {
  const body = $('#billbody')
  body.innerHTML = '<span class="hint">加载中…</span>'
  let r
  try {
    r = await fetch('/api/bills?limit=200').then((x) => x.json())
  } catch (e) {
    body.innerHTML = `<span class="hint">读取失败：${esc(e.message)}</span>`
    return
  }
  if (!r.ok) {
    body.innerHTML = `<span class="hint">读取失败：${esc(r.error || 'unknown')}</span>`
    return
  }
  $('#billfile').textContent = r.file || ''
  const s = r.summary || {}
  const all = r.allTime || {}
  const agents = Object.entries(s.byAgent || {}).sort(
    (a, b) => (b[1].costUsd || 0) - (a[1].costUsd || 0) || (b[1].credits || 0) - (a[1].credits || 0) || (b[1].total || 0) - (a[1].total || 0)
  )
  const byAgent = agents.length
    ? `<table class="bt"><thead><tr><th>Agent</th><th>任务</th><th>输入</th><th>输出</th><th>费用</th><th>积分</th></tr></thead><tbody>${agents
        .map(
          ([id, a]) =>
            `<tr><td>${esc(label(id))}</td><td>${a.runs}</td><td>${fmtNum(a.input)}</td><td>${fmtNum(a.output)}</td><td>${fmtUsd(a.costUsd)}</td><td>${fmtCr(a.credits)}</td></tr>`
        )
        .join('')}</tbody></table>`
    : '<div class="hint">还没有账单记录。跑一个任务后这里会出现。</div>'

  const days = Object.entries(s.byDay || {})
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))
    .slice(0, 7)
  const byDay = days.length
    ? `<table class="bt"><thead><tr><th>日期</th><th>任务</th><th>Token</th><th>费用</th><th>积分</th></tr></thead><tbody>${days
        .map(
          ([d, x]) =>
            `<tr><td>${esc(d)}</td><td>${x.runs}</td><td>${fmtNum(x.total)}</td><td>${fmtUsd(x.costUsd)}</td><td>${fmtCr(x.credits)}</td></tr>`
        )
        .join('')}</tbody></table>`
    : ''

  const rows = (r.bills || [])
    .map((b) => {
      const u = b.usage || {}
      const money =
        [u.costUsd != null ? fmtUsd(u.costUsd) : '', u.credits != null ? `${fmtCr(u.credits)} 积分` : ''].filter(Boolean).join(' · ') || '—'
      const status = b.status === 'done' ? '完成' : b.status === 'cancelled' ? '取消' : '失败'
      const tokens = u.total ?? (u.input == null && u.output == null ? null : (u.input || 0) + (u.output || 0))
      const tip = escAttr(`${b.id} · usage=${u.source || 'none'}${u.note ? ` · ${u.note}` : ''}`)
      return `<tr title="${tip}">
        <td>${esc(billWhen(b.ts))}</td>
        <td>${esc(label(b.agentId))}<div class="hint">${esc(b.model || '')}</div></td>
        <td>${status}</td><td>${fmtNum(tokens)}</td><td>${money}</td>
        <td class="pr" title="${escAttr(b.prompt || '')}">${esc(b.prompt || '')}</td></tr>`
    })
    .join('')

  body.innerHTML = `
    <div class="bcards">
      <div class="bcard"><span class="k">任务数</span><b>${s.runs || 0}</b><span class="hint"> 完成 ${s.done || 0} / 失败 ${s.error || 0} / 取消 ${s.cancelled || 0}</span></div>
      <div class="bcard"><span class="k">累计费用（CLI 返回）</span><b>${fmtUsd(s.costUsd)}</b></div>
      <div class="bcard"><span class="k">累计积分（Trae / Qoder）</span><b>${fmtCr(s.credits)}</b></div>
      <div class="bcard"><span class="k">累计 token</span><b>${fmtNum(s.total)}</b><span class="hint"> in ${fmtNum(s.input)} / out ${fmtNum(s.output)}</span></div>
    </div>
    <div class="bsec">按 AGENT 聚合 · 全部历史 ${all.runs || 0} 个任务</div>
    ${byAgent}
    ${byDay ? `<div class="bsec">最近 7 天</div>${byDay}` : ''}
    <div class="bsec">最近任务</div>
    <table class="bt"><thead><tr><th>时间</th><th>Agent</th><th>状态</th><th>Token</th><th>费用/积分</th><th>任务</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="hint">暂无</td></tr>'}</tbody></table>
    <div class="hint">费用与积分只记各 CLI 实际返回的值；未返回的显示「—」，不会当成 0。</div>
  `
}

$('#bills').onclick = () => {
  $('#billpanel').classList.remove('hidden')
  loadBills()
}
$('#billclose').onclick = () => $('#billpanel').classList.add('hidden')
$('#billrefresh').onclick = () => loadBills()
function scheduleBills() {
  setTimeout(() => {
    const p = $('#billpanel')
    if (p && !p.classList.contains('hidden')) loadBills()
  }, 1200)
}

$('#reauth').onclick = async () => {
  // 探测期间按钮已 disabled；这里再兜一层，防止连点叠加请求
  if (verifying.size || queued.size) return
  log('正在逐家做真实握手（qoder ~8s / minimax ~11s / workbuddy ~10s）…', 'sys')
  await loadAgents(true, { awaitVerify: true })
  log('登录状态已刷新', 'sys')
}
loadAgents().then(() => {
  // 默认勾选第一个「活着」的 agent：先 live 在线，再 ACP，最后任意已安装
  const first =
    agents.find((a) => a.installed && a.live?.up) ||
    agents.find((a) => a.installed && a.transports.some((t) => t.kind === 'acp')) ||
    agents.find((a) => a.installed)
  if (first) { selected.add(first.id); renderAgents(); renderTargets() }
})
connect()
setInterval(() => {
  document.querySelectorAll('.age[data-state="age"]').forEach((el) => {
    const ts = Number(el.dataset.ts)
    if (!ts) return
    el.textContent = probeAge(ts)
    el.style.color = ageColor(ts)
  })
  renderProbeButton()
}, 5000)
